name: Pre-Release (Develop)

on:
    workflow_run:
        workflows:
            - "CI/CD Pipeline"
            - "Integration Tests - WinCC OA"
        types:
            - completed
        branches:
            - develop
    workflow_dispatch:
        inputs: {}

permissions:
    contents: write
    pull-requests: write
    packages: write
    actions: write
    checks: write
    issues: write

jobs:
    pre-release:
        if: |
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        uses: winccoa-tools-pack/.github/workflows/reusable-prerelease.yml@main
        with:
            target_branch: develop
            project_type: vscode
        secrets: inherit

    cleanup-old-prereleases:
        needs: [pre-release]
        if: always() && needs.pre-release.result == 'success'
        uses: winccoa-tools-pack/.github/workflows/reusable-cleanup-prereleases-by-branch.yml@main
        with:
            target_branch: develop
            keep_latest: 3
        secrets: inherit
